<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Clean Slate · Now I can run · animator1</title>
<style>
  @font-face { font-family: A1Archivo; src: url(fonts/Archivo-VF.ttf) format('truetype'); font-weight: 100 900; font-stretch: 62% 125%; }
  @font-face { font-family: A1Mono; src: url(fonts/IBMPlexMono-Regular.ttf) format('truetype'); font-weight: 400; }

  html, body { margin: 0; height: 100%; background: #0c091e; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 56.25vw; max-height: 100vh; max-width: 177.78vh; margin: auto; position: absolute; inset: 0; }
  #ui { position: fixed; left: 12px; bottom: 10px; font: 12px/1.4 Consolas, monospace; color: #8a8a90; user-select: none; z-index: 2; }

<body>
<div id="ui">点击播放 · 空格暂停 · ←/→ 跳 1 s · ?t=85.6 静帧 · ?sheet=80.9,89.6,24 接触表 · ?samples=6 看运动模糊</div>
<script>
  if (location.protocol === 'file:') {
    document.getElementById('ui').innerHTML = '';
    document.body.insertAdjacentHTML('beforeend', '<div style="position:fixed;inset:0;display:grid;place-items:center;color:#f6f2fc;font:20px/1.8 Consolas,monospace;text-align:center"><div>' +
      '双击打开（file://）放不了。先跑 <b>python _web/serve.py --port 5430</b>，再打开<br>' +
      '<b style="color:#3de0ff">http://localhost:5430/_web/animator1/now_i_can_run.html</b></div></div>');
  }
</script>
<script type="module" src="now_i_can_run.js"></script>
</body>
