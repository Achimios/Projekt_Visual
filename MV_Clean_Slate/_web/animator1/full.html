<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Clean Slate · 全片 · animator1</title>
<style>
  /* 字体从 pdoom-video 拷来（OFL，许可证在 fonts/OFL.txt）：Archivo 可变宽度轴 62–125 是这一版排版的主角 */
  @font-face { font-family: A1Archivo; src: url(fonts/Archivo-VF.ttf) format('truetype'); font-weight: 100 900; font-stretch: 62% 125%; }
  @font-face { font-family: A1Mono; src: url(fonts/IBMPlexMono-Regular.ttf) format('truetype'); font-weight: 400; }
  @font-face { font-family: A1Mono; src: url(fonts/IBMPlexMono-Medium.ttf) format('truetype'); font-weight: 500; }
  html, body { margin: 0; height: 100%; background: #0c091e; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 56.25vw; max-height: 100vh; max-width: 177.78vh; margin: auto; position: absolute; inset: 0; }
  #ui { position: fixed; left: 12px; bottom: 10px; font: 12px/1.4 Consolas, monospace; color: #8a8a90; user-select: none; z-index: 2; }
</style>
</head>
<body>
<div id="ui">点击播放 · 空格暂停 · ←/→ 跳 1 s · ?t=36.5 静帧 · ?sheet=28.3,43.8,16 接触表 · ?samples=8 看运动模糊</div>
<script>
  // 双击用 file:// 打开时，module 和 fetch 都会被浏览器拦掉 → 黑屏。这里给一句人话。
  if (location.protocol === 'file:') {
    document.getElementById('ui').innerHTML = '';
    document.body.insertAdjacentHTML('beforeend', '<div style="position:fixed;inset:0;display:grid;place-items:center;color:#f6f2fc;font:20px/1.8 Consolas,monospace;text-align:center"><div>' +
      '双击打开（file://）放不了：浏览器不让本地文件加载脚本和数据。<br>' +
      '请先跑本地服务 <b>python _web/serve.py --port 5430</b>（或 SimuWeb 的 launch.json「clean-slate」），再打开<br>' +
      '<b style="color:#3de0ff">http://localhost:5430/_web/animator1/full.html</b><br>点一下画面开始跟歌放，空格暂停</div></div>');
  }
</script>
<script type="module" src="full.js"></script>
</body>
</html>
