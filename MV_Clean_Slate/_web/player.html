<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Clean Slate 播放器</title>
<style>
  :root { --bg: #0b0c10; --panel: #12141a; --line: #23262f; --text: #d6d8de; --dim: #7c808c; --hi: #6fd3ff; --warm: #ffb25e; --mark: #ff6f8e; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.45 "Segoe UI", "Microsoft YaHei", sans-serif; overflow: hidden; user-select: none; }
  button { font: inherit; color: var(--text); background: #1b1e26; border: 1px solid var(--line); border-radius: 5px; padding: 3px 9px; cursor: pointer; }
  button:hover { border-color: var(--dim); }
  button.on { color: #071018; background: var(--hi); border-color: var(--hi); }
  #app { display: grid; grid-template-columns: 264px 1fr; height: 100%; }

  #side { display: flex; flex-direction: column; min-height: 0; background: var(--panel); border-right: 1px solid var(--line); }
  #list { flex: 1 1 60%; overflow-y: auto; padding: 8px 6px; min-height: 0; }
  .group { margin: 12px 8px 4px; color: var(--dim); font-size: 12px; }
  .item { display: flex; align-items: center; gap: 6px; padding: 5px 8px; border-radius: 5px; cursor: pointer; }
  .item:hover { background: #1b1e26; }
  .item.sel { background: #17324a; color: #fff; }
  .item.b { box-shadow: inset 2px 0 0 var(--warm); }
  .item .name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tag { font-size: 10px; color: var(--dim); border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; }
  .tag.live { color: var(--hi); border-color: #2c5a72; }
  #notesWrap { flex: 0 1 34%; display: flex; flex-direction: column; min-height: 96px; border-top: 1px solid var(--line); }
  #notesHead { padding: 7px 14px; color: var(--dim); font-size: 12px; }
  #notes { flex: 1; overflow-y: auto; padding: 0 6px 8px; }
  .note { display: flex; gap: 7px; padding: 4px 8px; border-radius: 5px; cursor: pointer; }
  .note:hover { background: #1b1e26; }
  .note b { color: var(--mark); font-weight: 500; font-variant-numeric: tabular-nums; }
  .note span { flex: 1; user-select: text; word-break: break-word; }
  .note i { color: var(--dim); font-style: normal; visibility: hidden; }
  .note:hover i { visibility: visible; }

  #main { display: grid; grid-template-rows: 1fr auto auto auto; min-width: 0; min-height: 0; }
  #stage { position: relative; display: flex; gap: 6px; justify-content: center; align-items: center; min-height: 0; padding: 10px; background: #050608; }
  .slot { position: relative; flex: 1 1 0; height: 100%; min-width: 0; display: flex; align-items: center; justify-content: center; }
  .slot[hidden] { display: none; }
  .screen { position: relative; aspect-ratio: 16 / 9; max-width: 100%; max-height: 100%; width: 100%; background: #000; overflow: hidden; }
  .screen iframe, .screen video { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; pointer-events: none; visibility: hidden; object-fit: contain; }
  .screen .show { visibility: visible; }
  .tip { position: absolute; left: 8px; top: 6px; font-size: 11px; color: #cfd3dc; background: #000a; padding: 1px 6px; border-radius: 3px; pointer-events: none; }
  #lyric { min-height: 28px; padding: 4px 16px; text-align: center; font-size: 15px; color: var(--dim); white-space: nowrap; overflow: hidden; }
  #lyric .now { color: #fff; }
  #bar { display: flex; align-items: center; gap: 8px; padding: 5px 12px; border-top: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
  #time { font: 15px Consolas, monospace; min-width: 96px; color: #fff; }
  #beat, #perf { font: 12px Consolas, monospace; color: var(--dim); }
  #perf { margin-left: auto; }
  #keys { color: var(--dim); font-size: 11px; }
  #tl { display: block; width: 100%; height: 118px; background: #0d0f14; cursor: ew-resize; }
  #noteBox { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); display: none; gap: 8px; align-items: center; padding: 8px 10px; background: var(--panel); border: 1px solid var(--mark); border-radius: 7px; z-index: 5; }
  #noteBox.open { display: flex; }
  @media (max-width: 1250px) { #keys { display: none; } }
  @media (max-width: 760px) { #app { grid-template-columns: 1fr; grid-template-rows: 30% 1fr; } #notesWrap { display: none; } #side { border-right: 0; border-bottom: 1px solid var(--line); } }
  #noteBox input { width: min(52vw, 560px); padding: 5px 8px; color: var(--text); background: #0b0c10; border: 1px solid var(--line); border-radius: 4px; outline: none; font: inherit; user-select: text; }
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <div id="list"></div>
    <div id="notesWrap">
      <div id="notesHead">打点（M）· 存到 _反馈/打点.json</div>
      <div id="notes"></div>
    </div>
  </aside>
  <main id="main">
    <div id="stage">
      <div class="slot" id="slotA"><div class="screen"></div></div>
      <div class="slot" id="slotB" hidden><div class="screen"></div></div>
      <div id="noteBox"><b id="noteT"></b><input id="noteIn" placeholder="这一刻想说什么，回车保存，Esc 取消"></div>
    </div>
    <div id="lyric"></div>
    <div id="bar">
      <button id="play">播放</button>
      <span id="time">0:00.00</span>
      <span id="beat"></span>
      <button id="loop" title="L">循环</button>
      <button id="rate" title="[ ]">1×</button>
      <button id="src" title="V">实时</button>
      <button id="full" title="F">全屏</button>
      <span id="keys">空格 播放 · ←→ 1 秒 · Shift+←→ 1 拍 · , . 1 帧 · ↑↓ 换片 · I O 区间 · Shift+点击 A/B 对比 · 滚轮缩放 · 双击复位</span>
      <span id="perf"></span>
    </div>
    <canvas id="tl"></canvas>
  </main>
</div>
<script type="module" src="player.js"></script>
</body>
</html>
